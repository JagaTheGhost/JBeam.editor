name: Build and Release JBeam.editor & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Application & Bootstrapper
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ----------------------------------------------------
      # 1. Build JBeam.editor Main Application
      # ----------------------------------------------------
      - name: Install Application Dependencies
        working-directory: jbeam-studio
        run: npm install

      - name: Build Web Production Assets (Vite)
        working-directory: jbeam-studio
        run: npm run build

      - name: Package Windows Application Payload (.zip)
        working-directory: jbeam-studio
        run: |
          npx electron-builder --win zip --publish never
          $zip = Get-ChildItem -Path "release" -Filter "*.zip" | Select-Object -First 1
          if ($zip -and $zip.Name -ne "jbeam-studio-win-x64.zip") {
            Copy-Item -Path $zip.FullName -Destination "release/jbeam-studio-win-x64.zip" -Force
          }

      # ----------------------------------------------------
      # 2. Build Custom Web Bootstrapper Installer
      # ----------------------------------------------------
      - name: Build Standalone Installer Executable
        working-directory: installer
        run: |
          npm install
          npx electron-builder --win portable --publish never
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe -and $exe.Name -ne "JBeam.editor-Setup-v0.2Beta.exe") {
            Copy-Item -Path $exe.FullName -Destination "dist/JBeam.editor-Setup-v0.2Beta.exe" -Force
          }

      # ----------------------------------------------------
      # 3. Publish Both to GitHub Releases
      # ----------------------------------------------------
      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JBeam.editor ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: true
          generate_release_notes: true
          files: |
            installer/dist/*.exe
            jbeam-studio/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
